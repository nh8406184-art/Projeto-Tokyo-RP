<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tokyo RP Mobile</title>
  <!-- Ícones Phosphor/FontAwesome para os botões -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #050505;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }

    /* Container do Telemóvel */
    .phone-container {
      width: 100%;
      max-width: 390px;
      height: 780px;
      background: url('https://images.unsplash.com/photo-1503899036084-c55cdd92da26?q=80&w=1000&auto=format&fit=crop') no-repeat center center/cover;
      border-radius: 44px;
      border: 10px solid #1a1a1a;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9), 0 0 15px rgba(255, 0, 85, 0.15);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* Overlay escuro sobre a imagem de fundo para dar legibilidade */
    .phone-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.4) 0%, rgba(0, 0, 0, 0.7) 100%);
      z-index: 1;
    }

    /* Conteúdo relativo acima do overlay */
    .phone-body {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 15px 20px;
    }

    /* Dynamic Island / Relógio no topo */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .user-actions {
      display: flex;
      gap: 8px;
    }

    .btn-profile {
      width: 32px;
      height: 32px;
      background: #e60039;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.85rem;
    }

    .btn-sair {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border: none;
      color: #fff;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Cabeçalho da Marca */
    .brand-header {
      margin-top: 5px;
      margin-bottom: 15px;
    }

    .japanese-sub {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.6);
      letter-spacing: 2px;
    }

    .brand-title {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .brand-desc {
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.7);
    }

    /* Card Status Servidor Glassmorphism */
    .server-card {
      background: rgba(40, 20, 25, 0.55);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 20px;
      position: relative;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #ff3366;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background: #00ff88;
      border-radius: 50%;
      box-shadow: 0 0 8px #00ff88;
    }

    .player-count {
      font-size: 2rem;
      font-weight: 800;
      margin-top: 4px;
    }

    .player-count span {
      font-size: 0.9rem;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.5);
    }

    .version-tag {
      position: absolute;
      right: 16px;
      bottom: 16px;
      text-align: right;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.5);
    }

    /* Gestor de Telas */
    .screens-container {
      flex: 1;
      overflow-y: auto;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    /* Grelha de Apps */
    .apps-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      padding: 5px 0;
    }

    .app-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      color: white;
      cursor: pointer;
    }

    .app-box {
      width: 68px;
      height: 68px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3);
      transition: transform 0.15s ease;
    }

    .app-item:active .app-box {
      transform: scale(0.92);
    }

    .app-label {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.9);
      font-weight: 500;
    }

    /* Cores dos Ícones exatos da imagem */
    .bg-anuncios { background: linear-gradient(135deg, #ff0055, #e60039); }
    .bg-noticias { background: linear-gradient(135deg, #ff9900, #e68a00); }
    .bg-chat     { background: linear-gradient(135deg, #ff5533, #e6391a); }
    .bg-clima    { background: linear-gradient(135deg, #ffbb00, #e6a600); }
    .bg-tokyo    { background: linear-gradient(135deg, #ff3399, #e61a80); }
    .bg-banco    { background: linear-gradient(135deg, #00cc88, #00b377); }
    .bg-discord  { background: rgba(50, 50, 50, 0.7); backdrop-filter: blur(10px); }

    /* Botão Flutuante (Ação Rápida) */
    .fab-btn {
      position: absolute;
      bottom: 35px;
      right: 20px;
      width: 50px;
      height: 50px;
      background: #ff0044;
      border-radius: 50%;
      border: none;
      color: white;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 20px rgba(255, 0, 68, 0.4);
      cursor: pointer;
    }

    /* Rodapé */
    .phone-footer {
      text-align: center;
      font-size: 0.65rem;
      letter-spacing: 1.5px;
      color: rgba(255, 255, 255, 0.4);
      padding: 10px 0 5px 0;
    }

    /* Cartões Internos das Telas */
    .content-card {
      background: rgba(30, 30, 35, 0.75);
      backdrop-filter: blur(15px);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
      border-left: 3px solid #ff0055;
    }

    .btn-voltar {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 0.8rem;
      margin-bottom: 15px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="phone-container">
    <div class="phone-overlay"></div>

    <div class="phone-body">
      <!-- Topo -->
      <div class="top-bar">
        <span>19:51</span>
        <div class="user-actions">
          <div class="btn-profile">J</div>
          <button class="btn-sair"><i class="fa-solid fa-arrow-right-from-bracket"></i> Sair</button>
        </div>
      </div>

      <!-- Área de Telas -->
      <div class="screens-container">
        
        <!-- TELA INICIAL -->
        <div id="screen-home" class="screen active">
          <div class="brand-header">
            <div class="japanese-sub">東京ロールプレイ</div>
            <div class="brand-title">Tokyo RP</div>
            <div class="brand-desc">O roleplay que nunca dorme.</div>
          </div>

          <!-- Card do Servidor -->
          <div class="server-card">
            <div class="status-badge">
              <span class="status-dot"></span> SERVIDOR ONLINE
            </div>
            <div class="player-count">
              342 <span>/500 jogadores</span>
            </div>
            <div class="version-tag">
              versão<br><strong>2.4.1</strong>
            </div>
          </div>

          <!-- Grid de Apps estilo iOS -->
          <div class="apps-grid">
            <button class="app-item" onclick="navigate('anuncios')">
              <div class="app-box bg-anuncios"><i class="fa-solid fa-bullhorn"></i></div>
              <span class="app-label">Anúncios</span>
            </button>

            <button class="app-item" onclick="navigate('noticias')">
              <div class="app-box bg-noticias"><i class="fa-solid fa-newspaper"></i></div>
              <span class="app-label">Notícias</span>
            </button>

            <button class="app-item" onclick="navigate('chat')">
              <div class="app-box bg-chat"><i class="fa-solid fa-comment-dots"></i></div>
              <span class="app-label">Chat</span>
            </button>

            <button class="app-item" onclick="navigate('clima')">
              <div class="app-box bg-clima"><i class="fa-solid fa-cloud-sun"></i></div>
              <span class="app-label">Clima</span>
            </button>

            <button class="app-item" onclick="navigate('tokyo')">
              <div class="app-box bg-tokyo"><i class="fa-solid fa-map"></i></div>
              <span class="app-label">Tokyo</span>
            </button>

            <button class="app-item" onclick="navigate('banco')">
              <div class="app-box bg-banco"><i class="fa-solid fa-wallet"></i></div>
              <span class="app-label">Banco</span>
            </button>

            <a href="https://discord.gg" target="_blank" class="app-item" style="text-decoration: none;">
              <div class="app-box bg-discord"><i class="fa-brands fa-discord"></i></div>
              <span class="app-label">Discord</span>
            </a>
          </div>
        </div>

        <!-- TELA DE ANÚNCIOS -->
        <div id="screen-anuncios" class="screen">
          <button class="btn-voltar" onclick="navigate('home')"><i class="fa-solid fa-chevron-left"></i> Voltar</button>
          <h3 style="margin-bottom: 15px;">📢 Anúncios Recentes</h3>
          <div class="content-card">
            <div style="font-size: 0.75rem; color: #ff0055; margin-bottom: 4px;">ADMINISTRAÇÃO</div>
            <p style="font-size: 0.85rem;">Seja bem-vindo ao novo aplicativo oficial do Tokyo RP!</p>
          </div>
        </div>

        <!-- OUTRAS TELAS (Estrutura simples) -->
        <div id="screen-noticias" class="screen">
          <button class="btn-voltar" onclick="navigate('home')"><i class="fa-solid fa-chevron-left"></i> Voltar</button>
          <h3>📰 Notícias da Cidade</h3>
        </div>

        <div id="screen-chat" class="screen">
          <button class="btn-voltar" onclick="navigate('home')"><i class="fa-solid fa-chevron-left"></i> Voltar</button>
          <h3>💬 Chat Comunitário</h3>
        </div>

      </div>

      <!-- Botão Mágico Flutuante -->
      <button class="fab-btn"><i class="fa-solid fa-wand-magic-sparkles"></i></button>

      <!-- Rodapé -->
      <div class="phone-footer">
        東京 · ROLEPLAY · DESLIZE OS APPS
      </div>
    </div>
  </div>

  <script>
    function navigate(screenName) {
      const screens = document.querySelectorAll('.screen');
      screens.forEach(s => s.classList.remove('active'));

      const target = document.getElementById('screen-' + screenName);
      if (target) {
        target.classList.add('active');
      }
    }
  </script>
</body>
</html>
