<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tokyo RP</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    body {
      background-color: #050508;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* TELEMÓVEL MOCKUP MODERNO */
    .mobile-screen {
      width: 100vw;
      height: 100vh;
      max-width: 430px;
      max-height: 932px;
      position: relative;
      background: linear-gradient(180deg, rgba(10, 10, 18, 0.65) 0%, rgba(5, 5, 10, 0.88) 100%), 
                  url('https://images.unsplash.com/photo-1503899036084-c55cdd92da26?q=80&w=1000&auto=format&fit=crop') center/cover no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px 22px 24px 22px;
      box-shadow: 0 0 80px rgba(230, 0, 57, 0.25), 0 0 40px rgba(0,0,0,0.9);
      border-radius: 40px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    @media (max-width: 480px) {
      .mobile-screen {
        border-radius: 0;
        border: none;
      }
    }

    /* BARRA SUPERIOR DE STATUS DO TELEMÓVEL */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
      z-index: 10;
    }

    .clock {
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: -0.3px;
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.85);
    }

    /* CABEÇALHO DO SERVIDOR */
    .header-text {
      margin-top: 18px;
    }

    .japanese-sub {
      font-size: 0.72rem;
      color: #ff2a5f;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .main-title {
      font-size: 2.4rem;
      font-weight: 900;
      letter-spacing: -0.8px;
      margin: 2px 0 2px 0;
      background: linear-gradient(135deg, #ffffff 0%, #d8d8d8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .tagline {
      font-size: 0.88rem;
      color: rgba(255, 255, 255, 0.65);
      font-weight: 400;
    }

    /* CARD DE STATUS ONLINE DO SERVIDOR */
    .status-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 18px 20px;
      margin-top: 18px;
      box-shadow: inset 0 1px 1px rgba(255,255,255,0.1);
    }

    .status-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.68rem;
      letter-spacing: 1.5px;
      color: rgba(255, 255, 255, 0.55);
      font-weight: 700;
    }

    .online-indicator {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #00ff75;
      border-radius: 50%;
      margin-right: 6px;
      box-shadow: 0 0 10px #00ff75;
    }

    .player-count {
      margin-top: 8px;
      font-size: 2.1rem;
      font-weight: 800;
      color: #fff;
    }

    .player-count span {
      font-size: 0.95rem;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.45);
    }

    /* GRELHA DE APLICATIVOS REDESENHADA */
    .app-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px 18px;
      margin-top: 28px;
    }

    .app-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;
      cursor: pointer;
      text-decoration: none;
      color: #fff;
      transition: transform 0.18s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .app-item:active {
      transform: scale(0.88);
    }

    .app-icon {
      width: 70px;
      height: 70px;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.7rem;
      box-shadow: 0 12px 24px rgba(0,0,0,0.4);
      border: 1px solid rgba(255, 255, 255, 0.15);
      position: relative;
      overflow: hidden;
    }

    .app-icon::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 40%;
      background: linear-gradient(180deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 100%);
      pointer-events: none;
    }

    .app-label {
      font-size: 0.82rem;
      color: rgba(255, 255, 255, 0.92);
      font-weight: 500;
      letter-spacing: -0.2px;
    }

    /* BOTÃO FLUTUANTE DE ASSISTENTE */
    .fab-btn {
      position: absolute;
      bottom: 38px;
      right: 24px;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff0055 0%, #e60039 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      box-shadow: 0 8px 25px rgba(230, 0, 57, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .fab-btn:active {
      transform: scale(0.9);
    }

    .footer-nav {
      text-align: center;
      font-size: 0.68rem;
      letter-spacing: 2.5px;
      color: rgba(255, 255, 255, 0.35);
      margin-bottom: 2px;
      font-weight: 600;
    }

    /* ECRÃ DE APLICATIVO EM TELA CHEIA (SLIDE UP ESTILO IOS/ANDROID) */
    .app-screen {
      position: absolute;
      inset: 0;
      background: #0d0d12;
      z-index: 90;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.38s cubic-bezier(0.16, 1, 0.3, 1);
      padding: 16px 20px 24px 20px;
    }

    .app-screen.active {
      transform: translateY(0);
    }

    .app-screen-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 20px;
      margin-top: 10px;
    }

    .app-screen-title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.3rem;
      font-weight: 800;
    }

    .app-screen-title i {
      color: #ff0055;
      font-size: 1.4rem;
    }

    .close-screen-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255,255,255,0.1);
      color: #fff;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      transition: background 0.2s;
    }

    .close-screen-btn:active {
      background: rgba(255, 255, 255, 0.2);
    }

    .app-screen-content {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* CARDS DE CONTEÚDO DENTRO DOS APPS */
    .content-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 20px;
      padding: 18px;
    }

    .content-card h4 {
      font-size: 1.05rem;
      margin-bottom: 8px;
      color: #ff3366;
    }

    .content-card p {
      font-size: 0.88rem;
      line-height: 1.55;
      color: rgba(255, 255, 255, 0.8);
    }

    .list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 0.9rem;
    }

    .list-item:last-child {
      border-bottom: none;
    }
  </style>
</head>
<body>

  <div class="mobile-screen">

    <!-- ECRÃ DE APLICATIVO REAL (JANELA SLIDE UP) -->
    <div class="app-screen" id="appScreen">
      <div class="app-screen-header">
        <div class="app-screen-title">
          <i id="appScreenIcon" class="fa-solid fa-circle"></i>
          <span id="appScreenTitle">Nome do App</span>
        </div>
        <button type="button" class="close-screen-btn" onclick="closeAppScreen()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="app-screen-content" id="appScreenContent"></div>
    </div>

    <!-- HOME DO TELEMÓVEL COM OS APLICATIVOS -->
    <div>
      <div class="top-bar">
        <span class="clock" id="screenClock">19:51</span>
        <div class="status-icons">
          <i class="fa-solid fa-signal"></i>
          <i class="fa-solid fa-wifi"></i>
          <i class="fa-solid fa-battery-full"></i>
        </div>
      </div>

      <div class="header-text">
        <div class="japanese-sub">東京ロールプレイ</div>
        <div class="main-title">Tokyo RP</div>
        <p class="tagline">O roleplay que nunca dorme.</p>
      </div>

      <div class="status-card">
        <div class="status-header">
          <span><span class="online-indicator"></span>SERVIDOR ONLINE</span>
          <span>v2.4.1</span>
        </div>
        <div class="player-count">
          342 <span>/ 500 jogadores</span>
        </div>
      </div>

      <!-- GRELHA DE APPS INTERATIVOS -->
      <div class="app-grid">
        <div class="app-item" onclick="openApp('announcements')">
          <div class="app-icon" style="background: linear-gradient(135deg, #ff0055 0%, #ff5500 100%);">
            <i class="fa-solid fa-bullhorn"></i>
          </div>
          <span class="app-label">Anúncios</span>
        </div>

        <div class="app-item" onclick="openApp('news')">
          <div class="app-icon" style="background: linear-gradient(135deg, #ff9900 0%, #ff5500 100%);">
            <i class="fa-solid fa-newspaper"></i>
          </div>
          <span class="app-label">Notícias</span>
        </div>

        <div class="app-item" onclick="openApp('chat')">
          <div class="app-icon" style="background: linear-gradient(135deg, #ff3366 0%, #ff0055 100%);">
            <i class="fa-solid fa-comment-dots"></i>
          </div>
          <span class="app-label">Chat</span>
        </div>

        <div class="app-item" onclick="openApp('weather')">
          <div class="app-icon" style="background: linear-gradient(135deg, #ffcc00 0%, #ff8800 100%);">
            <i class="fa-solid fa-cloud-sun-rain"></i>
          </div>
          <span class="app-label">Clima</span>
        </div>

        <div class="app-item" onclick="openApp('tokyo')">
          <div class="app-icon" style="background: linear-gradient(135deg, #e60073 0%, #9900cc 100%);">
            <i class="fa-solid fa-map-location-dot"></i>
          </div>
          <span class="app-label">Tokyo GPS</span>
        </div>

        <div class="app-item" onclick="openApp('bank')">
          <div class="app-icon" style="background: linear-gradient(135deg, #00cc88 0%, #008055 100%);">
            <i class="fa-solid fa-wallet"></i>
          </div>
          <span class="app-label">Banco</span>
        </div>
      </div>
    </div>

    <button type="button" class="fab-btn" onclick="openApp('support')">
      <i class="fa-solid fa-wand-magic-sparkles"></i>
    </button>

    <div class="footer-nav">
      東京 • ROLEPLAY • TOQUE NOS APPS
    </div>

  </div>

  <script>
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('screenClock').innerText = `${hours}:${minutes}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    const appsData = {
      announcements: {
        title: 'Anúncios',
        icon: 'fa-bullhorn',
        html: `
          <div class="content-card">
            <h4>📢 Atualização da Cidade (v2.4.1)</h4>
            <p>Novo sistema de concessionárias e novos veículos importados adicionados no centro de Shibuya!</p>
          </div>
          <div class="content-card">
            <h4>🚨 Regras de Convivência</h4>
            <p>Lembre-se de manter o amor à vida em situações de risco. Respeite as diretrizes de RP da cidade.</p>
          </div>
        `
      },
      news: {
        title: 'Tokyo Times',
        icon: 'fa-newspaper',
        html: `
          <div class="content-card">
            <h4>🏎️ Corridas em Shinjuku</h4>
            <p>A polícia aumentou as patrulhas na região após relatos de rachas noturnos.</p>
          </div>
          <div class="content-card">
            <h4>💼 Vagas de Emprego</h4>
            <p>O Hospital Geral de Tokyo está a recrutar novos médicos e paramédicos nesta semana.</p>
          </div>
        `
      },
      chat: {
        title: 'Mensagens Directas',
        icon: 'fa-comment-dots',
        html: `
          <div class="content-card">
            <div class="list-item">
              <div>
                <strong>Kenji_Saito</strong><br>
                <span style="font-size:0.78rem; color:rgba(255,255,255,0.5);">Encontramo-nos na praça central?</span>
              </div>
              <span style="font-size:0.72rem; color:#ff3366; font-weight: 600;">19:42</span>
            </div>
            <div class="list-item">
              <div>
                <strong>Miya_Aki</strong><br>
                <span style="font-size:0.78rem; color:rgba(255,255,255,0.5);">O veículo já está pronto no mecânico.</span>
              </div>
              <span style="font-size:0.72rem; color:rgba(255,255,255,0.4);">Ontem</span>
            </div>
          </div>
        `
      },
      weather: {
        title: 'Clima em Tokyo',
        icon: 'fa-cloud-sun-rain',
        html: `
          <div class="content-card" style="text-align: center; padding: 24px 18px;">
            <i class="fa-solid fa-cloud-moon-rain" style="font-size: 3.2rem; color: #ffcc00; margin-bottom: 12px;"></i>
            <h2 style="font-size: 2.2rem; font-weight: 800;">18°C</h2>
            <p style="color: rgba(255,255,255,0.7);">Chuva Fraca Noturna</p>
          </div>
          <div class="content-card">
            <div class="list-item"><span>Humidade</span><strong>82%</strong></div>
            <div class="list-item"><span>Vento</span><strong>12 km/h</strong></div>
            <div class="list-item"><span>Visibilidade</span><strong>Boa</strong></div>
          </div>
        `
      },
      tokyo: {
        title: 'GPS & Mapa',
        icon: 'fa-map-location-dot',
        html: `
          <div class="content-card">
            <h4>📍 Pontos de Interesse</h4>
            <div class="list-item"><span>Praça Central (Shinjuku)</span><span style="color:#00ff75; font-weight:600;">Aberto</span></div>
            <div class="list-item"><span>Hospital Geral</span><span style="color:#00ff75; font-weight:600;">Aberto</span></div>
            <div class="list-item"><span>Departamento Policial</span><span style="color:#00ff75; font-weight:600;">Aberto</span></div>
            <div class="list-item"><span>Concessionária Central</span><span style="color:#00ff75; font-weight:600;">Aberto</span></div>
          </div>
        `
      },
      bank: {
        title: 'Banco Mazuma',
        icon: 'fa-wallet',
        html: `
          <div class="content-card" style="background: linear-gradient(135deg, #00b377 0%, #00593b 100%); border: none;">
            <p style="color: rgba(255,255,255,0.75); font-size: 0.72rem; font-weight: 700; letter-spacing: 1px;">SALDO DISPONÍVEL</p>
            <h2 style="font-size: 2.3rem; margin: 8px 0; font-weight: 800;">¥ 150.000</h2>
            <p style="font-size: 0.82rem; color: rgba(255,255,255,0.85);">Carteira: ¥ 2.500</p>
          </div>
          <div class="content-card">
            <h4>Últimas Transações</h4>
            <div class="list-item"><span>Loja de Conveniência</span><span style="color:#ff3366; font-weight:600;">- ¥ 150</span></div>
            <div class="list-item"><span>Pagamento de Salário</span><span style="color:#00ff75; font-weight:600;">+ ¥ 2.500</span></div>
          </div>
        `
      },
      support: {
        title: 'Suporte Tokyo',
        icon: 'fa-wand-magic-sparkles',
        html: `
          <div class="content-card">
            <h4>✨ Atendimento ao Cidadão</h4>
            <p>Precisa de tirar dúvidas ou reportar algum problema na cidade? Abra um bilhete com a nossa equipa no fórum oficial ou entre em contato com a prefeitura.</p>
          </div>
        `
      }
    };

    function openApp(appKey) {
      const data = appsData[appKey];
      if (!data) return;

      document.getElementById('appScreenTitle').innerText = data.title;
      document.getElementById('appScreenIcon').className = `fa-solid ${data.icon}`;
      document.getElementById('appScreenContent').innerHTML = data.html;

      document.getElementById('appScreen').classList.add('active');
    }

    function closeAppScreen() {
      document.getElementById('appScreen').classList.remove('active');
    }
  </script>
</body>
</html>
