<script>
  // Função para buscar e exibir os anúncios no app do celular
  async function carregarAnuncios() {
    const conteinerAnuncios = document.getElementById('lista-anuncios');
    
    // Mostra mensagem de carregando
    if (conteinerAnuncios) {
      conteinerAnuncios.innerHTML = '<p class="loading">Carregando avisos...</p>';
    }

    try {
      // Substitua pela URL do seu JSON ou API de integração
      const resposta = await fetch('SUA_URL_JSON_AQUI');
      const dados = await resposta.json();

      let htmlConteudo = '';
      
      // Itera sobre as mensagens recebidas
      dados.forEach(item => {
        htmlConteudo += `
          <div class="card-anuncio">
            <div class="autor-info">
              <strong>${item.autor || 'TOKYO CITY'}</strong>
              <small>${item.data || ''}</small>
            </div>
            <p>${item.mensagem}</p>
          </div>
        `;
      });

      if (conteinerAnuncios) {
        conteinerAnuncios.innerHTML = htmlConteudo;
      }
    } catch (erro) {
      console.error('Erro ao carregar anúncios:', erro);
      if (conteinerAnuncios) {
        conteinerAnuncios.innerHTML = '<p class="erro">Não foi possível carregar os avisos no momento.</p>';
      }
    }
  }

  // Executa a função assim que a tela de Anúncios for aberta
  document.addEventListener('DOMContentLoaded', () => {
    carregarAnuncios();
  });
</script>
